site_name: Munchies Engineering Reports
site_url: https://norby99.github.io/munchies/reports/
repo_url: https://github.com/Norby99/munchies
repo_name: Norby99/munchies
docs_dir: docs/reports
site_dir: docs/pages/reports
use_directory_urls: true

theme:
  name: material
  palette:
    scheme: slate
    primary: indigo
    accent: light blue
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - tables
  - toc:
      permalink: true

nav:
  - Reports Home: index.md
  - Software Process Engineering (SPE):
      - Overview: spe/index.md
      - Deliverables:
          - Glossary: spe/01-deliverables/glossary.md
          - Domain Model: spe/01-deliverables/domain-model.md
      - Implementation:
          - Microservices: spe/02-implementation/microservices.md
          - Testing: spe/02-implementation/testing.md
          - Multiplatform: spe/02-implementation/multiplatform.md
      - DevOps:
          - Project Structure: spe/03-devops/project-structure.md
          - VCS & Release: spe/03-devops/vcs.md
          - Quality Assurance: spe/03-devops/qa.md
          - CI/CD Workflows: spe/03-devops/cicd.md
      - Deployment: spe/04-deployment.md
      - Benchmark: spe/05-benchmark.md
      - Conclusions: spe/06-conclusions.md
  - Applicazioni e Servizi Web (ASW):
      - Overview: asw/index.md
  - Distributed Systems (DS):
      - Overview: ds/index.md
  - Software Architecture And Platforms (SAAP):
      - Overview: saap/index.md
  - Advanced Software Modeling and Development (ASMD):
      - Overview: asmd/index.md
  - Other Munchies Docs:
      - Main Docs Hub: https://norby99.github.io/munchies/
      - Kotlin Docs (Dokka): https://norby99.github.io/munchies/kotlin/index.html
      - OpenAPI Specs: https://norby99.github.io/munchies/openapi/index.html
      - TypeScript Docs: https://norby99.github.io/munchies/typescript/index.html
