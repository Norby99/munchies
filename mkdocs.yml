site_name: Munchies Engineering Reports
site_url: https://norby99.github.io/munchies/reports/
repo_url: https://github.com/Norby99/munchies
repo_name: Norby99/munchies
docs_dir: docs/reports
site_dir: docs/pages/reports
use_directory_urls: true

theme:
  name: material
  palette:
    # Dark Mode (Default)
    - scheme: slate
      primary: indigo
      accent: light blue
      toggle:
        icon: material/weather-night
        name: Switch to light mode

    # Light Mode
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode

  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - tables
  - toc:
      permalink: true

nav:
  - Reports Home: index.md
  - SPE:
      - Overview: spe/index.md
      - Deliverables:
          - Glossary: spe/01-deliverables/glossary.md
          - Domain Model: spe/01-deliverables/domain-model.md
      - Implementation:
          - Microservices: spe/02-implementation/microservices.md
          - Testing: spe/02-implementation/testing.md
          - Multiplatform: spe/02-implementation/multiplatform.md
      - DevOps:
          - Project Structure: spe/03-devops/project-structure.md
          - VCS & Release: spe/03-devops/vcs.md
          - Quality Assurance: spe/03-devops/qa.md
          - CI/CD Workflows: spe/03-devops/cicd.md
      - Deployment: spe/04-deployment.md
      - Conclusions: spe/05-conclusions.md
  - ASW:
      - Overview: asw/index.md
  - DS:
      - Overview: ds/index.md
      - Concept:
          - ds/01-concept/concept.md
      - Requirements:
          - ds/02-requirements/requirements.md
      - Design:
          - ds/03-design/design.md
          - ds/03-design/architecture.md
          - ds/03-design/modelling.md
          - ds/03-design/interaction.md
          - ds/03-design/behaviour.md
          - ds/03-design/data-and-consistency-issues.md
          - ds/03-design/infrastructure.md
          - ds/03-design/fault-tolerance.md
          - ds/03-design/availability.md
          - ds/03-design/security.md
      - Implementation:
          - ds/04-implementation/implementation.md
          - ds/04-implementation/technological-details.md
      - Validation:
