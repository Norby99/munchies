# Trimmed override for the upstream `grafana-community/tempo` chart
#
# Always-on, like the rest of the stack: installed by `./gradlew deploy` (the
# `deployObservability` task) and removed by `./gradlew undeploy`, see observability/README.md.

tempo:
  reportingEnabled: false
  retention: 24h
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 384Mi
  # Keeps the Go runtime below the container limit, as for Grafana.
  extraEnv:
    - name: GOMEMLIMIT
      value: 300MiB

persistence:
  enabled: false
