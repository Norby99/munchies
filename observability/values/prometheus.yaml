# Trimmed override for the upstream `prometheus-community/prometheus` chart.
#
# Always-on: installed by `./gradlew deploy` (the `deployObservability` task) and removed by
# `./gradlew undeploy`, see observability/README.md.

# Disabled to lighten the deploy
alertmanager:
  enabled: false

prometheus-node-exporter:
  enabled: false

prometheus-pushgateway:
  enabled: false

# kube-state-metrics exports Deployment/HPA object state as metrics — this is what gives us
# `kube_horizontalpodautoscaler_status_current_replicas` / `..._desired_replicas` and
# `kube_deployment_status_replicas_ready` time series for the scaling graphs.
kube-state-metrics:
  enabled: true
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

server:
  global:
    # Decreasing the interval default (1m) for load testing.
    scrape_interval: 15s
    evaluation_interval: 15s
  persistentVolume:
    enabled: true # the stack is always-on: history must survive a pod restart or a redeploy
    size: 2Gi
  retention: 3d
  retentionSize: 1500MB # stays below the volume size, whichever limit is reached first
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  service:
    type: ClusterIP # internal only; use `kubectl port-forward` to view the Prometheus UI directly
