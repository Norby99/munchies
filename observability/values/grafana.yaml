# Trimmed override for the upstream `grafana-community/grafana` chart (the canonical repo
# as of 2026 — the old grafana.github.io/helm-charts repo is deprecated/migrating).
#
# Always-on, like Prometheus: installed by `./gradlew deploy` (the `deployObservability` task)
# and removed by `./gradlew undeploy`, see observability/README.md.

resources:
  requests:
    cpu: 50m
    memory: 96Mi
  limits:
    cpu: 200m
    memory: 256Mi

persistence:
  enabled: false # ephemeral: dashboards/datasource are provisioned from values on every start, nothing to persist

service:
  type: ClusterIP # internal only; `kubectl port-forward svc/grafana 3000:80 -n observability` to view

# Provisioned datasources — the first points at the Prometheus Service from observability/values/prometheus.yaml
# (release name "prometheus", namespace "observability" — adjust both if you install under different names).
datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: Prometheus
        uid: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus-server.observability.svc.cluster.local
        isDefault: true
        jsonData:
          # Must match `server.global.scrape_interval` in values/prometheus.yaml: panels using
          # `$__rate_interval` derive their rate window from it.
          timeInterval: 15s
      # Points at the Loki Service from observability/values/loki.yaml (release name "loki").
      - name: Loki
        uid: Loki
        type: loki
        access: proxy
        url: http://loki.observability.svc.cluster.local:3100

# Provisioned dashboards — inlined so this values file is fully self-contained (no external
# dashboards.grafana.com fetch, no dependency on a file living on the target cluster's disk).
dashboardProviders:
  dashboardproviders.yaml:
    apiVersion: 1
    providers:
      - name: munchies
        orgId: 1
        folder: Munchies
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards/munchies

dashboards:
  munchies:
    scaling:
      json: |
        {
          "title": "Munchies — Scaling",
          "uid": "munchies-scaling",
          "schemaVersion": 39,
          "version": 1,
          "editable": true,
          "timezone": "utc",
          "time": { "from": "now-30m", "to": "now" },
          "refresh": "10s",
          "templating": {
            "list": [
              {
                "name": "namespace",
                "type": "textbox",
                "label": "Namespace",
                "current": { "text": "gateway-service", "value": "gateway-service" },
                "query": "gateway-service"
              }
            ]
          },
          "panels": [
            {
              "id": 1,
              "title": "Ready replicas",
              "type": "timeseries",
              "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
              "datasource": { "type": "prometheus", "uid": "Prometheus" },
              "fieldConfig": { "defaults": { "unit": "short", "min": 0 }, "overrides": [] },
              "targets": [
                {
                  "datasource": { "type": "prometheus", "uid": "Prometheus" },
                  "expr": "kube_deployment_status_replicas_ready{namespace=\"$namespace\"}",
                  "legendFormat": "{{ deployment }} ready",
                  "refId": "A"
                }
              ]
            },
            {
              "id": 2,
              "title": "HPA current vs desired replicas",
              "type": "timeseries",
              "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
              "datasource": { "type": "prometheus", "uid": "Prometheus" },
              "fieldConfig": { "defaults": { "unit": "short", "min": 0 }, "overrides": [] },
              "targets": [
                {
                  "datasource": { "type": "prometheus", "uid": "Prometheus" },
                  "expr": "kube_horizontalpodautoscaler_status_current_replicas{namespace=\"$namespace\"}",
                  "legendFormat": "{{ horizontalpodautoscaler }} current",
                  "refId": "A"
                },
                {
                  "datasource": { "type": "prometheus", "uid": "Prometheus" },
                  "expr": "kube_horizontalpodautoscaler_status_desired_replicas{namespace=\"$namespace\"}",
                  "legendFormat": "{{ horizontalpodautoscaler }} desired",
                  "refId": "B"
                }
              ]
            },
            {
              "id": 3,
              "title": "CPU usage per pod (cAdvisor) vs request",
              "type": "timeseries",
              "gridPos": { "h": 8, "w": 24, "x": 0, "y": 8 },
              "datasource": { "type": "prometheus", "uid": "Prometheus" },
              "fieldConfig": { "defaults": { "unit": "short", "min": 0 }, "overrides": [] },
              "targets": [
                {
                  "datasource": { "type": "prometheus", "uid": "Prometheus" },
                  "expr": "sum(rate(container_cpu_usage_seconds_total{namespace=\"$namespace\", container!=\"\", container!=\"POD\"}[1m])) by (pod)",
                  "legendFormat": "{{ pod }} cpu cores",
                  "refId": "A"
                },
                {
                  "datasource": { "type": "prometheus", "uid": "Prometheus" },
                  "expr": "sum(kube_pod_container_resource_requests{namespace=\"$namespace\", resource=\"cpu\"}) by (pod)",
                  "legendFormat": "{{ pod }} requested",
                  "refId": "B"
                }
              ]
            }
          ]
        }
    services:
      json: |
        {
          "title": "Munchies — Services",
          "uid": "munchies-services",
          "schemaVersion": 39,
          "version": 1,
          "editable": true,
          "timezone": "utc",
          "time": {
            "from": "now-30m",
            "to": "now"
          },
          "refresh": "10s",
          "templating": {
            "list": [
              {
                "name": "namespace",
                "type": "textbox",
                "label": "Namespace",
                "current": {
                  "text": "gateway-service",
                  "value": "gateway-service"
                },
                "query": "gateway-service"
              }
            ]
          },
          "panels": [
            {
              "id": 1,
              "title": "Request rate by service",
              "description": "Handled HTTP requests per second, excluding health checks and metric scrapes.",
              "type": "timeseries",
              "gridPos": {
                "h": 8,
                "w": 12,
                "x": 0,
                "y": 0
              },
              "datasource": {
                "type": "prometheus",
                "uid": "Prometheus"
              },
              "fieldConfig": {
                "defaults": {
                  "min": 0,
                  "unit": "reqps"
                },
                "overrides": []
              },
              "targets": [
                {
                  "datasource": {
                    "type": "prometheus",
                    "uid": "Prometheus"
                  },
                  "expr": "sum by (namespace) (rate(http_server_requests_seconds_count{uri!~\"/health|/metrics|/prometheus\"}[$__rate_interval]))",
                  "legendFormat": "{{ namespace }}",
                  "refId": "A"
                }
              ]
            },
            {
              "id": 2,
              "title": "Error ratio by service",
              "description": "Share of requests answered with a 5xx status.",
              "type": "timeseries",
              "gridPos": {
                "h": 8,
                "w": 12,
                "x": 12,
                "y": 0
              },
              "datasource": {
                "type": "prometheus",
                "uid": "Prometheus"
              },
              "fieldConfig": {
                "defaults": {
                  "min": 0,
                  "unit": "percentunit",
                  "max": 1
                },
                "overrides": []
              },
              "targets": [
                {
                  "datasource": {
                    "type": "prometheus",
                    "uid": "Prometheus"
                  },
                  "expr": "sum by (namespace) (rate(http_server_requests_seconds_count{uri!~\"/health|/metrics|/prometheus\", status=~\"5..\"}[$__rate_interval])) / sum by (namespace) (rate(http_server_requests_seconds_count{uri!~\"/health|/metrics|/prometheus\"}[$__rate_interval]))",
                  "legendFormat": "{{ namespace }}",
                  "refId": "A"
                }
              ]
            },
            {
              "id": 3,
              "title": "Latency p95 by service",
              "description": "95th percentile of request duration, aggregated across replicas.",
              "type": "timeseries",
              "gridPos": {
                "h": 8,
                "w": 12,
                "x": 0,
                "y": 8
              },
              "datasource": {
                "type": "prometheus",
                "uid": "Prometheus"
              },
              "fieldConfig": {
                "defaults": {
                  "min": 0,
                  "unit": "s"
                },
                "overrides": []
              },
              "targets": [
                {
                  "datasource": {
                    "type": "prometheus",
                    "uid": "Prometheus"
                  },
                  "expr": "histogram_quantile(0.95, sum by (namespace, le) (rate(http_server_requests_seconds_bucket{uri!~\"/health|/metrics|/prometheus\"}[$__rate_interval])))",
                  "legendFormat": "{{ namespace }}",
                  "refId": "A"
                }
              ]
            },
            {
              "id": 4,
              "title": "Latency p50 / p95 / p99 ($namespace)",
              "description": "Request duration percentiles of the selected service.",
              "type": "timeseries",
              "gridPos": {
                "h": 8,
                "w": 12,
                "x": 12,
                "y": 8
              },
              "datasource": {
                "type": "prometheus",
                "uid": "Prometheus"
              },
              "fieldConfig": {
                "defaults": {
                  "min": 0,
                  "unit": "s"
                },
                "overrides": []
              },
              "targets": [
                {
                  "datasource": {
                    "type": "prometheus",
                    "uid": "Prometheus"
                  },
                  "expr": "histogram_quantile(0.5, sum by (le) (rate(http_server_requests_seconds_bucket{namespace=\"$namespace\", uri!~\"/health|/metrics|/prometheus\"}[$__rate_interval])))",
                  "legendFormat": "p50",
                  "refId": "A"
                },
                {
                  "datasource": {
                    "type": "prometheus",
                    "uid": "Prometheus"
                  },
                  "expr": "histogram_quantile(0.95, sum by (le) (rate(http_server_requests_seconds_bucket{namespace=\"$namespace\", uri!~\"/health|/metrics|/prometheus\"}[$__rate_interval])))",
                  "legendFormat": "p95",
                  "refId": "B"
                },
                {
                  "datasource": {
                    "type": "prometheus",
                    "uid": "Prometheus"
                  },
                  "expr": "histogram_quantile(0.99, sum by (le) (rate(http_server_requests_seconds_bucket{namespace=\"$namespace\", uri!~\"/health|/metrics|/prometheus\"}[$__rate_interval])))",
                  "legendFormat": "p99",
                  "refId": "C"
                }
              ]
            },
            {
              "id": 5,
              "title": "Request rate by route ($namespace)",
              "description": "Traffic of the selected service, split by HTTP method and route template.",
              "type": "timeseries",
              "gridPos": {
                "h": 8,
                "w": 12,
                "x": 0,
                "y": 16
              },
              "datasource": {
                "type": "prometheus",
                "uid": "Prometheus"
              },
              "fieldConfig": {
                "defaults": {
                  "min": 0,
                  "unit": "reqps"
                },
                "overrides": []
              },
              "targets": [
                {
                  "datasource": {
                    "type": "prometheus",
                    "uid": "Prometheus"
                  },
                  "expr": "sum by (method, uri) (rate(http_server_requests_seconds_count{namespace=\"$namespace\", uri!~\"/health|/metrics|/prometheus\"}[$__rate_interval]))",
                  "legendFormat": "{{ method }} {{ uri }}",
                  "refId": "A"
                }
              ]
            },
            {
              "id": 6,
              "title": "Requests by status ($namespace)",
              "description": "Traffic of the selected service, split by response status code.",
              "type": "timeseries",
              "gridPos": {
                "h": 8,
                "w": 12,
                "x": 12,
                "y": 16
              },
              "datasource": {
                "type": "prometheus",
                "uid": "Prometheus"
              },
              "fieldConfig": {
                "defaults": {
                  "min": 0,
                  "unit": "reqps"
                },
                "overrides": []
              },
              "targets": [
                {
                  "datasource": {
                    "type": "prometheus",
                    "uid": "Prometheus"
                  },
                  "expr": "sum by (status) (rate(http_server_requests_seconds_count{namespace=\"$namespace\", uri!~\"/health|/metrics|/prometheus\"}[$__rate_interval]))",
                  "legendFormat": "{{ status }}",
                  "refId": "A"
                }
              ]
            },
            {
              "id": 7,
              "title": "Notifications consumed",
              "description": "Events notification-service has consumed from Kafka, by notification type.",
              "type": "timeseries",
              "gridPos": {
                "h": 8,
                "w": 12,
                "x": 0,
                "y": 24
              },
              "datasource": {
                "type": "prometheus",
                "uid": "Prometheus"
              },
              "fieldConfig": {
                "defaults": {
                  "min": 0,
                  "unit": "ops"
                },
                "overrides": []
              },
              "targets": [
                {
                  "datasource": {
                    "type": "prometheus",
                    "uid": "Prometheus"
                  },
                  "expr": "sum by (type) (rate(notifications_received_total[$__rate_interval]))",
                  "legendFormat": "{{ type }}",
                  "refId": "A"
                }
              ]
            },
            {
              "id": 8,
              "title": "Heap used by pod ($namespace)",
              "description": "JVM heap for the Micronaut services, V8 heap for the Express ones.",
              "type": "timeseries",
              "gridPos": {
                "h": 8,
                "w": 12,
                "x": 12,
                "y": 24
              },
              "datasource": {
                "type": "prometheus",
                "uid": "Prometheus"
              },
              "fieldConfig": {
                "defaults": {
                  "min": 0,
                  "unit": "bytes"
                },
                "overrides": []
              },
              "targets": [
                {
                  "datasource": {
                    "type": "prometheus",
                    "uid": "Prometheus"
                  },
                  "expr": "sum by (pod) (jvm_memory_used_bytes{namespace=\"$namespace\", area=\"heap\"})",
                  "legendFormat": "{{ pod }} (JVM)",
                  "refId": "A"
                },
                {
                  "datasource": {
                    "type": "prometheus",
                    "uid": "Prometheus"
                  },
                  "expr": "sum by (pod) (nodejs_heap_size_used_bytes{namespace=\"$namespace\"})",
                  "legendFormat": "{{ pod }} (Node.js)",
                  "refId": "B"
                }
              ]
            }
          ]
        }
    logs:
      json: |
        {
          "title": "Munchies — Logs",
          "uid": "munchies-logs",
          "schemaVersion": 39,
          "version": 1,
          "editable": true,
          "timezone": "utc",
          "time": {
            "from": "now-30m",
            "to": "now"
          },
          "refresh": "10s",
          "templating": {
            "list": [
              {
                "name": "namespace",
                "type": "textbox",
                "label": "Namespace (regex)",
                "current": {
                  "text": ".+-service",
                  "value": ".+-service"
                },
                "query": ".+-service"
              },
              {
                "name": "search",
                "type": "textbox",
                "label": "Contains",
                "current": {
                  "text": "",
                  "value": ""
                },
                "query": ""
              }
            ]
          },
          "panels": [
            {
              "id": 1,
              "title": "Log lines by service",
              "description": "Lines per second written by each service matching the namespace filter.",
              "type": "timeseries",
              "gridPos": {
                "h": 7,
                "w": 12,
                "x": 0,
                "y": 0
              },
              "datasource": {
                "type": "loki",
                "uid": "Loki"
              },
              "fieldConfig": {
                "defaults": {
                  "min": 0,
                  "unit": "short"
                },
                "overrides": []
              },
              "targets": [
                {
                  "datasource": {
                    "type": "loki",
                    "uid": "Loki"
                  },
                  "expr": "sum by (namespace) (rate({namespace=~\"$namespace\"}[$__auto]))",
                  "legendFormat": "{{ namespace }}",
                  "refId": "A"
                }
              ]
            },
            {
              "id": 2,
              "title": "Warnings and errors by service",
              "description": "Lines per second logged at WARN or ERROR level.",
              "type": "timeseries",
              "gridPos": {
                "h": 7,
                "w": 12,
                "x": 12,
                "y": 0
              },
              "datasource": {
                "type": "loki",
                "uid": "Loki"
              },
              "fieldConfig": {
                "defaults": {
                  "min": 0,
                  "unit": "short"
                },
                "overrides": []
              },
              "targets": [
                {
                  "datasource": {
                    "type": "loki",
                    "uid": "Loki"
                  },
                  "expr": "sum by (namespace, level) (rate({namespace=~\"$namespace\", level=~\"WARN|ERROR\"}[$__auto]))",
                  "legendFormat": "{{ namespace }} {{ level }}",
                  "refId": "A"
                }
              ]
            },
            {
              "id": 3,
              "title": "Logs",
              "description": "Log lines of the selected services, newest first. Use the Contains box to search, e.g. for a request or trace id.",
              "type": "logs",
              "gridPos": {
                "h": 18,
                "w": 24,
                "x": 0,
                "y": 7
              },
              "datasource": {
                "type": "loki",
                "uid": "Loki"
              },
              "options": {
                "showTime": true,
                "wrapLogMessage": true,
                "prettifyLogMessage": false,
                "enableLogDetails": true,
                "sortOrder": "Descending",
                "dedupStrategy": "none"
              },
              "targets": [
                {
                  "datasource": {
                    "type": "loki",
                    "uid": "Loki"
                  },
                  "expr": "{namespace=~\"$namespace\"} |= `$search`",
                  "refId": "A"
                }
              ]
            }
          ]
        }
