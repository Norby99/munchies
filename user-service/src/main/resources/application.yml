micronaut:
  server:
    port: 8080
    netty:
      # One log line per handled request, through the HTTP_ACCESS_LOGGER logger. Probes and
      # metric scrapes are left out: they would be most of the volume and carry no information.
      access-logger:
        enabled: true
        log-format: common
        exclusions:
          - /health
          - /prometheus
  application:
    name: user-service
  metrics:
    enabled: true
    export:
      prometheus:
        enabled: true
        descriptions: true
        step: PT1M
    binders:
      web:
        server:
          # Publish latency as histogram buckets so percentiles can be computed in Prometheus
          # (histogram_quantile) and aggregated across replicas.
          histogram: true
  openapi:
    enabled: true
  http:
    services:
      payment-service:
        url: ${PAYMENT_SERVICE_URL:http://localhost:8083}
      gateway-service:
        url: ${GATEWAY_SERVICE_URL:http://localhost:8086}
# Distributed tracing (see observability/). The service continues the trace carried by the
# `traceparent` header of an incoming request and puts it on the Kafka messages it sends.
otel:
  traces:
    # Spans are created either way, so log lines always carry a trace id; they are only sent
    # somewhere when the deployment sets OTEL_TRACES_EXPORTER=otlp together with
    # OTEL_EXPORTER_OTLP_ENDPOINT. Local runs and tests therefore need no collector.
    exporter: ${OTEL_TRACES_EXPORTER:none}
  # Metrics go through Micrometer and logs through stdout, not through OpenTelemetry.
  metrics:
    exporter: none
  logs:
    exporter: none
  exporter:
    otlp:
      protocol: http/protobuf
  # Probes and metric scrapes would be most of the traces and carry no information.
  exclusions:
    - /health
    - /prometheus

mongodb:
  uri: mongodb://localhost:27017/user-service

endpoints:
  health:
    enabled: true
    sensitive: false
  # Scraped by Prometheus (see observability/); exposes the Micrometer registry.
  prometheus:
    enabled: true
    sensitive: false

kafka:
  bootstrap:
    servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    org.apache.kafka: WARN