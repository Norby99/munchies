micronaut:
  server:
    port: 8080
  application:
    name: user-service
  metrics:
    enabled: true
    export:
      prometheus:
        enabled: true
        descriptions: true
        step: PT1M
    binders:
      web:
        server:
          # Publish latency as histogram buckets so percentiles can be computed in Prometheus
          # (histogram_quantile) and aggregated across replicas.
          histogram: true
  openapi:
    enabled: true
  http:
    services:
      payment-service:
        url: ${PAYMENT_SERVICE_URL:http://localhost:8083}
      gateway-service:
        url: ${GATEWAY_SERVICE_URL:http://localhost:8086}
mongodb:
  uri: mongodb://localhost:27017/user-service

endpoints:
  health:
    enabled: true
    sensitive: false
  # Scraped by Prometheus (see observability/); exposes the Micrometer registry.
  prometheus:
    enabled: true
    sensitive: false

kafka:
  bootstrap:
    servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    org.apache.kafka: WARN