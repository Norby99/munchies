serviceName: order-service
namespace: order-service

image:
  repository: order-service

service:
  type: NodePort

env:
  - name: MICRONAUT_ENVIRONMENTS
    value: "k8s,prod"
  - name: LOG_FORMAT
    value: "json"
  - name: OTEL_TRACES_EXPORTER
    value: "otlp"
  - name: OTEL_EXPORTER_OTLP_ENDPOINT
    value: "http://tempo.observability.svc.cluster.local:4318"
  - name: KAFKA_BOOTSTRAP_SERVERS
    value: "kafka-0.kafka-headless.kafka.svc.cluster.local:9092"
  - name: MONGODB_URI
    value: "mongodb://order-mongodb.order-service.svc.cluster.local:27017/orders"
  # Menu prices of every placed or updated order are read from restaurant-service.
  - name: RESTAURANT_SERVICE_URL
    value: "http://restaurant-service.restaurant-service.svc.cluster.local:8080"
  # The table of a dine-in order placed for a reservation is read from table-reservation-service.
  - name: TABLE_RESERVATION_SERVICE_URL
    value: "http://table-reservation-service.table-reservation-service.svc.cluster.local:8080"

metrics:
  path: /prometheus

autoscaling:
  enabled: true

mongodb:
  enabled: true
  databaseName: order-service
