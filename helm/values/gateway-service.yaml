# Stateless Express gateway: no Mongo, no Kafka — only routes to the other services.
serviceName: gateway-service
namespace: gateway-service

image:
  repository: gateway-service

service:
  type: NodePort

env:
  - name: PORT
    value: "8080"
  - name: JWT_SECRET
    value: "blastimus_prime"
  - name: USER_SERVICE_URL
    value: "http://user-service.user-service.svc.cluster.local:8080"
  - name: RESTAURANT_SERVICE_URL
    value: "http://restaurant-service.restaurant-service.svc.cluster.local:8080"
  - name: ORDER_SERVICE_URL
    value: "http://order-service.order-service.svc.cluster.local:8080"
  - name: PAYMENT_SERVICE_URL
    value: "http://payment-service.payment-service.svc.cluster.local:8080"
  - name: TABLE_RESERVATION_SERVICE_URL
    value: "http://table-reservation-service.table-reservation-service.svc.cluster.local:8080"
  - name: OTEL_EXPORTER_OTLP_ENDPOINT
    value: "http://tempo.observability.svc.cluster.local:4318"

readinessProbe:
  initialDelaySeconds: 5

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 8
  behavior:
    scaleUpPodsValue: 4

shutdown:
  preStopSleepSeconds: 10

resources:
  limits:
    cpu: "1"
