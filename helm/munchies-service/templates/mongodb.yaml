{{- if .Values.mongodb.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "munchies-service.shortName" . }}-mongo-pvc
  namespace: {{ .Values.namespace }}
  annotations:
    # Mirrors UndeployServicesTask's existing "keep data unless -PwipeData=true" behavior:
    # `helm uninstall` would otherwise delete this PVC (it's a plain tracked resource, not a
    # StatefulSet volumeClaimTemplate), wiping the database on every redeploy.
    "helm.sh/resource-policy": keep
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.mongodb.storage }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "munchies-service.shortName" . }}-mongodb
  namespace: {{ .Values.namespace }}
spec:
  serviceName: {{ include "munchies-service.shortName" . }}-mongodb
  replicas: 1
  selector:
    matchLabels:
      app: {{ include "munchies-service.shortName" . }}-mongodb
  template:
    metadata:
      labels:
        app: {{ include "munchies-service.shortName" . }}-mongodb
    spec:
      containers:
        - name: mongodb
          image: {{ .Values.mongodb.image }}
          ports:
            - containerPort: 27017
          env:
            - name: MONGO_INITDB_DATABASE
              value: {{ .Values.mongodb.databaseName | default .Values.serviceName }}
          resources:
            {{- toYaml .Values.mongodb.resources | nindent 12 }}
          livenessProbe:
            exec:
              command: ["mongosh", "--eval", "db.adminCommand('ping')"]
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
          volumeMounts:
            - name: {{ include "munchies-service.shortName" . }}-mongo-data
              mountPath: /data/db
      volumes:
        - name: {{ include "munchies-service.shortName" . }}-mongo-data
          persistentVolumeClaim:
            claimName: {{ include "munchies-service.shortName" . }}-mongo-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "munchies-service.shortName" . }}-mongodb
  namespace: {{ .Values.namespace }}
spec:
  selector:
    app: {{ include "munchies-service.shortName" . }}-mongodb
  ports:
    - port: 27017
      targetPort: 27017
{{- end }}
