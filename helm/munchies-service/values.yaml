# Default values for the munchies-service chart.
#
# This file documents every knob and gives it a safe default; each service under
# helm/values/<service>.yaml only overrides what actually differs (name, image, env,
# whether it owns a MongoDB, whether it's autoscaled) — see helm/README.md.

serviceName: "" # required override: used for the Deployment/Service/HPA/Mongo names, pod
# labels and (by default) the namespace — matches the project's one-namespace-per-service
# convention already used by the hand-written manifests under k8s/.
namespace: "" # required override: usually == serviceName.

image:
  repository: ""
  tag: latest
  pullPolicy: Never

replicaCount: 1
containerPort: 8080

service:
  type: ClusterIP
  port: 8080

env: []

readinessProbe:
  enabled: true
  path: /health
  port: 8080
  initialDelaySeconds: 10
  periodSeconds: 5

resources:
  requests:
    memory: "128Mi"
    cpu: "100m"
  limits:
    memory: "512Mi"
    cpu: "500m"

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 4
  targetCPUUtilizationPercentage: 60
  behavior:
    scaleUpStabilizationSeconds: 0
    scaleUpPodsValue: 2
    scaleUpPeriodSeconds: 30
    scaleDownStabilizationSeconds: 30
    scaleDownPodsValue: 1
    scaleDownPeriodSeconds: 30

mongodb:
  enabled: false
  image: mongo:7
  storage: 1Gi
  databaseName: "" # MONGO_INITDB_DATABASE; defaults to serviceName when empty
  resources:
    requests:
      memory: "256Mi"
      cpu: "250m"
    limits:
      memory: "512Mi"
      cpu: "500m"
