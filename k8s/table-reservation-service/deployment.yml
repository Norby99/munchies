apiVersion: apps/v1
kind: Deployment
metadata:
  name: table-reservation-service
  namespace: table-reservation-service
  labels:
    app: table-reservation-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: table-reservation-service
  template:
    metadata:
      labels:
        app: table-reservation-service
      annotations:
        # Picked up by the `kubernetes-pods` scrape job of the Prometheus chart (see observability/).
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "8080"
    spec:
      containers:
        - name: table-reservation-service
          image: table-reservation-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          env:
            - name: MICRONAUT_ENVIRONMENTS
              value: "k8s,prod"
            - name: RESTAURANT_SERVICE_URL
              value: "http://restaurant-service.restaurant-service.svc.cluster.local:8080"
            - name: MONGODB_URI
              value: "mongodb://table-reservation-mongodb:27017/table-reservation-service"
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "kafka-0.kafka-headless.kafka.svc.cluster.local:9092"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://tempo.observability.svc.cluster.local:4318"
            # How long a table stays booked, in minutes (a multiple of 15).
            - name: RESERVATION_DURATION_MINUTES
              value: "120"
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: table-reservation-service
  namespace: table-reservation-service
spec:
  selector:
    app: table-reservation-service
  ports:
    - port: 8080
      targetPort: 8080
  type: NodePort
