apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-service
  namespace: gateway-service
  labels:
    app: gateway-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway-service
  template:
    metadata:
      labels:
        app: gateway-service
    spec:
      containers:
        - name: gateway-service
          image: gateway-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: JWT_SECRET
              value: "blastimus_prime"
            - name: USER_SERVICE_URL
              value: "http://user-service.user-service.svc.cluster.local:8080"
            - name: RESTAURANT_SERVICE_URL
              value: "http://restaurant-service.restaurant-service.svc.cluster.local:8080"
            - name: ORDER_SERVICE_URL
              value: "http://order-service.order-service.svc.cluster.local:8080"
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: gateway-service
  namespace: gateway-service
spec:
  selector:
    app: gateway-service
  ports:
    - port: 8080
      targetPort: 8080
  type: NodePort
