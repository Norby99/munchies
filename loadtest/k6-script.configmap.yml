apiVersion: v1
kind: ConfigMap
metadata:
  name: k6-script
  namespace: loadtest
data:
  test.js: |
    import http from 'k6/http';
    import { check } from 'k6';

    // Override at apply time via the Job's env (TARGET_URL / PEAK_VUS / SUSTAIN).
    const URL = __ENV.TARGET_URL
      || 'http://gateway-service.gateway-service.svc.cluster.local:8080/health';
    const PEAK_VUS = Number(__ENV.PEAK_VUS || 150);
    const SUSTAIN = __ENV.SUSTAIN || '3m';

    export const options = {
      scenarios: {
        ramp: {
          executor: 'ramping-vus',
          startVUs: 0,
          gracefulRampDown: '10s',
          stages: [
            { duration: '1m', target: Math.round(PEAK_VUS / 3) }, // warm up
            { duration: '1m', target: Math.round(PEAK_VUS / 3) }, // baseline hold
            { duration: '1m', target: PEAK_VUS },                 // ramp to peak
            { duration: SUSTAIN, target: PEAK_VUS },              // sustain — HPA scales out here
            { duration: '2m', target: 0 },                        // ramp down — watch scale-in
          ],
        },
      },
      thresholds: {
        http_req_failed: ['rate<0.01'],
        http_req_duration: ['p(95)<800'],
      },
      summaryTrendStats: ['avg', 'min', 'med', 'p(90)', 'p(95)', 'p(99)', 'max'],
    };

    export default function () {
      const res = http.get(URL);
      check(res, { 'status is 200': (r) => r.status === 200 });
    }
