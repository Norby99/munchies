apiVersion: v1
kind: ConfigMap
metadata:
  name: k6-script
  namespace: loadtest
data:
  test.js: |
    import http from 'k6/http';
    import { check, fail } from 'k6';

    // Set through the Job's env by run.sh.
    const URL = __ENV.TARGET_URL
      || 'http://gateway-service.gateway-service.svc.cluster.local.:8080/auth/verify';
    const PEAK_RATE = Number(__ENV.PEAK_RATE || 1000);

    // The load, in requests per second: a baseline below the HPA target, a peak that drives the
    // scale-up, then a low rate held long enough for the service to scale back in while requests
    // are still being served. Edit this list for a different profile.
    const STAGES = [
      { duration: '30s', target: 20 },
      { duration: '90s', target: 20 },
      { duration: '1m', target: PEAK_RATE },
      { duration: '4m', target: PEAK_RATE },
      { duration: '30s', target: 20 },
      { duration: '6m', target: 20 },
      { duration: '30s', target: 0 },
    ];

    export const options = {
      discardResponseBodies: true,
      scenarios: {
        load: {
          // Open model: k6 starts requests at the set rate whatever the response time. VUs are
          // only the pool that sends them; when all 400 are waiting, k6 counts the requests it
          // could not start as dropped_iterations.
          executor: 'ramping-arrival-rate',
          startRate: 0,
          timeUnit: '1s',
          preAllocatedVUs: 50,
          maxVUs: 400,
          stages: STAGES,
        },
      },
      // The project's service level objectives (docs/reports/saap/03-Deployment/kubernetes.md),
      // so that k6 itself passes or fails the run on them.
      thresholds: {
        http_req_failed: ['rate<0.01'],
        http_req_duration: ['p(95)<800'],
      },
      summaryTrendStats: ['avg', 'min', 'med', 'p(90)', 'p(95)', 'p(99)', 'max'],
    };

    // /auth/verify needs a bearer token: get a fresh one from the gateway before the load starts,
    // so a run never fails on an expired token. Other targets get none.
    export function setup() {
      if (!URL.includes('/auth/verify')) {
        return { token: '' };
      }
      const origin = URL.match(/^https?:\/\/[^/]+/)[0];
      // discardResponseBodies is on for the load itself; this one body is needed.
      const res = http.get(`${origin}/auth/token`, { responseType: 'text' });
      if (res.status !== 200) {
        fail(`could not get a token from ${origin}/auth/token: status ${res.status}`);
      }
      return { token: res.json('token') };
    }

    export default function (data) {
      const res = http.get(URL, { headers: { Authorization: `Bearer ${data.token}` } });
      check(res, { 'status is 200': (r) => r.status === 200 });
    }

    // Replaces k6's default end-of-test table with a short summary, followed by the full summary
    // object on one line prefixed with K6_JSON:, which run.sh extracts from the log into
    // summary.json (the Job's filesystem disappears with its pod).
    export function handleSummary(data) {
      const val = (name, key) => data.metrics[name] && data.metrics[name].values[key];
      const ms = (key) => `${(val('http_req_duration', key) || 0).toFixed(1)}ms`;

      const text = [
        '',
        '=== k6 summary ===',
        `target ............. ${URL}`,
        `peak rate .......... ${PEAK_RATE} req/s`,
        `requests ........... ${val('http_reqs', 'count')}`,
        `latency med/p95/p99  ${ms('med')} / ${ms('p(95)')} / ${ms('p(99)')}`,
        `latency max ........ ${ms('max')}`,
        `error rate ......... ${((val('http_req_failed', 'rate') || 0) * 100).toFixed(2)}%`,
        `dropped iterations . ${val('dropped_iterations', 'count') || 0}`,
        '==================',
        '',
      ].join('\n');

      return { stdout: text + '\nK6_JSON:' + JSON.stringify(data) + '\n' };
    }
