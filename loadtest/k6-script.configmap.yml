apiVersion: v1
kind: ConfigMap
metadata:
  name: k6-script
  namespace: loadtest
data:
  test.js: |
    import http from 'k6/http';
    import { check } from 'k6';

    // Override at apply time via the Job's env (TARGET_URL / PEAK_VUS / SUSTAIN / etc).
    const URL = __ENV.TARGET_URL
      || 'http://gateway-service.gateway-service.svc.cluster.local.:8080/health';
    const PEAK_VUS = Number(__ENV.PEAK_VUS || 150);
    const WARMUP = __ENV.WARMUP || '1m';
    const BASELINE = __ENV.BASELINE || '1m';
    const RAMP = __ENV.RAMP || '1m';
    const SUSTAIN = __ENV.SUSTAIN || '3m';
    const RAMPDOWN = __ENV.RAMPDOWN || '2m';

    const AUTH_TOKEN = __ENV.AUTH_TOKEN || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiJiZW5jaG1hcmstdXNlciIsImlkIjoiYmVuY2htYXJrLXVzZXIiLCJyb2xlIjoiQ1VTVE9NRVIiLCJpYXQiOjE3OTI2MTI1NjAsImV4cCI6MTc5MzIxNzM2MH0.GWkgbCSOi2R9Y6fXQdU2WVj57KSRBkgwYi4n9E6JRRs';

    export const options = {
      discardResponseBodies: true,
      scenarios: {
        ramp: {
          executor: 'ramping-vus',
          startVUs: 0,
          gracefulRampDown: '10s',
          stages: [
            { duration: WARMUP, target: Math.round(PEAK_VUS / 3) }, // warm up
            { duration: BASELINE, target: Math.round(PEAK_VUS / 3) }, // baseline hold
            { duration: RAMP, target: PEAK_VUS },                 // ramp to peak
            { duration: SUSTAIN, target: PEAK_VUS },              // sustain — HPA scales out here
            { duration: RAMPDOWN, target: 0 },                    // ramp down — watch scale-in
          ],
        },
      },
      thresholds: {
        http_req_failed: ['rate<0.05'],
        http_req_duration: ['p(95)<1500'],
      },
      summaryTrendStats: ['avg', 'min', 'med', 'p(90)', 'p(95)', 'p(99)', 'max'],
    };

    export default function () {
      const res = http.get(URL, {
        headers: {
          Authorization: `Bearer ${AUTH_TOKEN}`,
        },
      });
      check(res, { 'status is 200': (r) => r.status === 200 });
    }

    // Overriding handleSummary() replaces k6's default end-of-test table. We print a short
    // human-readable summary AND the full summary object as a single JSON line prefixed with
    // K6_JSON: — run.sh greps that prefix out of `kubectl logs` to save a machine-readable
    // summary.json, since the Job's own filesystem disappears once the pod is cleaned up.
    export function handleSummary(data) {
      const val = (name, key) => {
        const v = data.metrics[name] && data.metrics[name].values;
        return v ? v[key] : undefined;
      };
      const num = (n, d = 1) => (typeof n === 'number' ? n.toFixed(d) : 'n/a');
      const pct = (n) => (typeof n === 'number' ? (n * 100).toFixed(2) + '%' : 'n/a');

      const text = [
        '',
        '=== k6 summary ===',
        `target ............. ${URL}`,
        `peak VUs ............ ${PEAK_VUS}`,
        `iterations (reqs) ... ${val('iterations', 'count') ?? 'n/a'}`,
        `throughput .......... ${num(val('http_reqs', 'rate'), 2)} req/s`,
        `latency avg/p95/p99 . ${num(val('http_req_duration', 'avg'))}ms / ` +
          `${num(val('http_req_duration', 'p(95)'))}ms / ${num(val('http_req_duration', 'p(99)'))}ms`,
        `latency max ......... ${num(val('http_req_duration', 'max'))}ms`,
        `error rate .......... ${pct(val('http_req_failed', 'rate'))}`,
        '===================',
        '',
      ].join('\n');

      return {
        stdout: text + '\nK6_JSON:' + JSON.stringify(data) + '\n',
      };
    }
