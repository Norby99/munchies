apiVersion: batch/v1
kind: Job
metadata:
  name: k6-load
  namespace: loadtest
spec:
  backoffLimit: 0
  completions: 1
  parallelism: 1
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app: k6-load
    spec:
      restartPolicy: Never
      dnsConfig:
        options:
          - name: ndots
            value: "1"
      containers:
        - name: k6
          image: grafana/k6:latest # pin a version (e.g. grafana/k6:0.55.0) for reproducible runs
          args: ["run", "/scripts/test.js"] # summary rendering is fully handled by handleSummary() in the script
          env:
            - name: TARGET_URL
              value: "http://gateway-service.gateway-service.svc.cluster.local.:8080/health"
            - name: PEAK_VUS
              value: "150"
            - name: SUSTAIN
              value: "3m"
            - name: WARMUP
              value: "1m"
            - name: BASELINE
              value: "1m"
            - name: RAMP
              value: "1m"
            - name: RAMPDOWN
              value: "2m"
          volumeMounts:
            - name: script
              mountPath: /scripts
          resources:
            requests:
              cpu: "1"
              memory: "512Mi"
            limits:
              cpu: "6"
              memory: "3Gi"
      volumes:
        - name: script
          configMap:
            name: k6-script
