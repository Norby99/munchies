$kind: http-request
description: Placeholder request for listing restaurants.
url: "{{baseUrl}}/restaurants"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Restaurant list returned success', function () {
          pm.expect(pm.response.code).to.eql(200);
      });

      pm.test('Response is an array or contains restaurant data', function () {
          let json = pm.response.json();
          pm.expect(json).to.satisfy(function (value) {
              return Array.isArray(value) || typeof value === 'object';
          });
      });
    language: text/javascript
settings: {}
order: 1000
