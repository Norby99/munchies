$kind: http-request
description: Placeholder request for fetching a restaurant by ID. Replace {{restaurantId}} after you know the right value or save it from another step.
url: "{{baseUrl}}/restaurants/{{restaurantId}}"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Restaurant lookup returned success', function () {
          pm.expect(pm.response.code).to.eql(200);
      });

      pm.test('Response includes a restaurant object', function () {
          let json = pm.response.json();
          pm.expect(json).to.be.an('object');
      });
    language: text/javascript
settings: {}
order: 2000
