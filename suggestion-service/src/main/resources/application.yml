micronaut:
  server:
    port: 8080
  application:
    name: suggestion-service
  openapi:
    enabled: true
  http:
    services:
      gateway-service:
        url: ${GATEWAY_SERVICE_URL:http://localhost:8086}

  serde:
    serialization:
      inclusion: ALWAYS

endpoints:
  health:
    enabled: true
    sensitive: false

kafka:
  bootstrap:
    servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    org.apache.kafka: WARN